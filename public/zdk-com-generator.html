<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zdk_gen</title>
</head>
<body>
    <script>
        const material = ["総務", "学内", "行事", "生活", "環境", "教育", "調査", "広報", "新入生", "歓迎", "特別", "情報", "処理", "推進", "国際"];
        function makecomm(){
            const len = material.length;
            let result = "";
            let content = document.getElementById("01")
            for (i = 0; i <Math.floor(Math.random() * 3 + 2); i++) {
                result = result + material[Math.floor(Math.random() * len)];
            }
            content.innerHTML = result+"委員会";
        }
    </script>
    <h1>ZDK委員会名称ジェネレータ</h1>
    <input type="button" value="委員会を作る" onclick="makecomm()">
    <p id="01"></p>
</body>
</html>
